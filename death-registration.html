<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Death Registration</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="app"><aside><h2>Birth Portal</h2><nav>
<a href="admin.html">Dashboard</a><a href="birth-registration.html">Birth Registration</a>
<a class="active" href="death-registration.html">Death Registration</a><a href="certificates.html">All Certificates</a>
<a href="hospital-management.html">Hospital Management</a><a href="verify.html">QR Verification</a>
</nav></aside><main class="content"><header><div><h1>All State Death Registration</h1><p>Death certificate record creation</p></div></header>
<section class="panel"><form id="certificateForm" class="form-grid">
<label>State<select id="state" required><option value="">Select State</option></select></label>
<label>District<select id="district"><option value="">Select District</option></select></label>
<label>Hospital / Local Body<select id="localBody"><option value="">Select saved authority</option></select></label>
<h3 class="full">Deceased Person</h3>
<label>Full Name<input id="personName" required></label><label class="local-field" data-local-for="personName">पूर्ण नाव<input id="personNameLocal" data-local-input="personName" placeholder="पूर्ण नाव"></label><label>Aadhaar Number<input id="aadhaar"></label>
<label>Gender<select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label>
<label>Date of Death<input id="eventDate" type="date" required></label><label>Place of Death<input id="eventPlace"></label><label class="local-field" data-local-for="eventPlace">मृत्यू ठिकाण<input id="eventPlaceLocal" data-local-input="eventPlace" placeholder="मृत्यू ठिकाण"></label>
<h3 class="full">Family Details</h3>
<label>Father Name<input id="fatherName"></label><label class="local-field" data-local-for="fatherName">वडिलांचे नाव<input id="fatherNameLocal" data-local-input="fatherName" placeholder="वडिलांचे नाव"></label><label>Mother Name<input id="motherName"></label><label class="local-field" data-local-for="motherName">आईचे नाव<input id="motherNameLocal" data-local-input="motherName" placeholder="आईचे नाव"></label><label>Spouse Name<input id="spouseName"></label><label class="local-field" data-local-for="spouseName">पती/पत्नीचे नाव<input id="spouseNameLocal" data-local-input="spouseName" placeholder="पती/पत्नीचे नाव"></label>
<h3 class="full">Address</h3>
<label>Address at Death<textarea id="addressEvent"></textarea></label><label class="local-field" data-local-for="addressEvent">मृत्यूवेळचा पत्ता<input id="addressEventLocal" data-local-input="addressEvent" placeholder="मृत्यूवेळचा पत्ता"></label><label>Permanent Address<textarea id="permanentAddress"></textarea></label><label class="local-field" data-local-for="permanentAddress">कायमचा पत्ता<input id="permanentAddressLocal" data-local-input="permanentAddress" placeholder="कायमचा पत्ता"></label>
<h3 class="full">Registration</h3>
<label>Registration Number<input id="registrationNumber"></label><label>Date of Registration<input id="registrationDate" type="date"></label>
<label>Issue Date<input id="issueDate" type="date"></label><label>Remarks<input id="remarks"></label><label class="local-field" data-local-for="remarks">शेरा<input id="remarksLocal" data-local-input="remarks" placeholder="शेरा"></label>
<div class="full"><button class="primary" type="submit">Save Death Certificate</button> <button class="secondary" type="reset">Reset</button></div>
<p id="formMessage" class="full login-message"></p>
</form></section></main></div>
<script>window.CERTIFICATE_TYPE="death";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/auth.js"></script><script src="js/state-language.js"></script><script src="js/all-india-districts.js"></script><script src="js/certificate-form.js"></script>
</body></html>
