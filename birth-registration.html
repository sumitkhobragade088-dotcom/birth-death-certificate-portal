<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All State Birth Registration</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="app"><aside><h2>Birth Portal</h2><nav><a href="admin.html">Dashboard</a><a class="active" href="birth-registration.html">Birth Registration</a>
<a href="hospital-management.html">Hospital Management</a><a href="form5-template.html">Templates</a></nav></aside>
<main class="content"><header><div><h1>All State Birth Registration / जन्म पंजीकरण</h1><p>State-wise registration form</p></div></header>
<section class="panel"><form class="form-grid">
<label>State / राज्य<select><option>Maharashtra</option><option>Madhya Pradesh</option><option>Gujarat</option><option>Karnataka</option><option>Rajasthan</option><option>West Bengal</option><option>Punjab</option><option>Delhi</option></select></label>
<label>Hospital / Local Body<select><option>Select saved hospital / authority</option></select></label>
<h3 class="full">1. Information of the Child</h3>
<label>Full Name<input placeholder="FULL NAME"></label><label>Aadhaar Number<input placeholder="XXXX XXXX XXXX"></label>
<label>Gender<select><option>Select Gender</option><option>Male</option><option>Female</option><option>Other</option></select></label>
<label>Date of Birth<input type="date"></label><label>Place of Birth<input placeholder="PLACE OF BIRTH"></label>
<h3 class="full">2. Parents Information</h3>
<label>Father Name<input></label><label>Father Aadhaar<input></label><label>Mother Name<input></label><label>Mother Aadhaar<input></label>
<h3 class="full">3. Address Details</h3>
<label>Address at time of Birth<textarea></textarea></label><label>Permanent Address<textarea></textarea></label>
<h3 class="full">4. Registration</h3>
<label>Date of Registration<input type="date"></label><label>Remarks<input></label>
<div class="full"><button type="button" class="primary" onclick="location.href='form5-template.html'">Preview Template</button> <button type="reset" class="secondary">Reset Form</button></div>
</form></section></main></div></body></html>
