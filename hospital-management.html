<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Management</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="app"><aside><h2>Birth Portal</h2><nav><a href="admin.html">Dashboard</a><a href="birth-registration.html">Birth Registration</a>
<a class="active" href="hospital-management.html">Hospital Management</a><a href="form5-template.html">Templates</a></nav></aside>
<main class="content"><header><div><h1>Hospital / Local Body Management</h1><p>Add Birth Hospital and maintain Birth Hospital List</p></div></header>
<section class="panel"><h2>Add Birth Hospital / Local Authority</h2><form id="hospitalForm" class="form-grid">
<label>State<select id="state"><option>Maharashtra</option></select></label>
<label>District<input id="district" placeholder="e.g. Gondia"></label>
<label>Taluka / Block<input id="taluka" placeholder="e.g. Deori"></label>
<label>Authority Type<select id="type"><option>Hospital</option><option>Municipal Corporation</option><option>Municipal Council</option><option>Nagar Panchayat</option><option>Gram Panchayat</option><option>Other</option></select></label>
<label>English Name<input id="nameEn" placeholder="e.g. Gram Panchayat Magardoh"></label>
<label>Local Language Name<input id="nameLocal" placeholder="e.g. ग्राम पंचायत मगरडोह"></label>
<label>Department<input id="department" value="Department of Health"></label>
<label>Designation<input id="designation" value="Sub-Registrar (Birth & Death)"></label>
<label>State / Authority Logo<input type="file" accept="image/*"></label>
<label>Form Logo<input type="file" accept="image/*"></label>
<label>Authorized Signature<input type="file" accept="image/*"></label>
<label>Form Number<input value="Form 5"></label>
<div class="full"><button class="primary" type="submit">Save Hospital / Authority</button></div></form></section>
<section class="panel"><h2>Birth Hospital List</h2><div id="hospitalList" class="empty">No saved hospitals in this local demo yet.</div></section>
</main></div><script src="js/hospital.js"></script></body></html>
