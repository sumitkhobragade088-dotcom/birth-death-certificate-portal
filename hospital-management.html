<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital / Local Body Master</title>
<link rel="stylesheet" href="css/style.css">
<style>
.master-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.master-grid .full{grid-column:1/-1}.master-grid label{display:block}
.master-grid textarea{min-height:90px}
.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.master-card{border:1px solid #d5d8df;border-radius:12px;padding:14px;margin:10px 0}
.master-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:760px){.master-grid,.asset-grid{grid-template-columns:1fr}.master-grid .full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside><h2>Birth Portal</h2><nav>
<a href="admin.html">Dashboard</a>
<a href="birth-registration.html">Birth Registration</a>
<a class="active" href="hospital-management.html">Hospital Management</a>
<a href="form5-template.html">Templates</a>
</nav></aside>
<main class="content">
<header><div><h1>Hospital / Local Body Master</h1>
<p>Complete certificate authority setup — State → District → Taluka/Block → Hospital/Local Body</p></div></header>

<section class="panel">
<h2 id="formHeading">Add Hospital / Local Body</h2>
<form id="masterForm" class="master-grid">
<input id="editId" type="hidden">

<label>State<select id="state" required><option value="">Select State</option></select></label>
<label>District<select id="district" required><option value="">Select District</option></select></label>
<label>Taluka / Block<input id="taluka" placeholder="e.g. Deori"></label>
<label>Authority Type<select id="authorityType">
<option>Hospital</option><option>Gram Panchayat</option><option>Nagar Panchayat</option>
<option>Municipal Council</option><option>Municipal Corporation</option><option>Municipality</option><option>Other</option>
</select></label>

<label>Authority / Hospital Name (English)<input id="nameEn" required></label>
<label>Authority / Hospital Name (Local)<input id="nameLocal"></label>
<label>Government / State Heading (English)<input id="governmentEn" placeholder="e.g. GOVERNMENT OF MAHARASHTRA"></label>
<label>Government / State Heading (Local)<input id="governmentLocal"></label>
<label>Department (English)<input id="departmentEn" placeholder="e.g. DEPARTMENT OF HEALTH"></label>
<label>Department (Local)<input id="departmentLocal"></label>
<label>Form Number (English)<input id="formNoEn" value="FORM 5"></label>
<label>Form Number (Local)<input id="formNoLocal"></label>

<label class="full">Statutory Text (English)
<textarea id="statutoryEn" placeholder="Issued under Section..."></textarea></label>
<label class="full">Statutory Text (Local Language)
<textarea id="statutoryLocal"></textarea></label>

<label class="full">Certification Paragraph (English)
<textarea id="certifyEn" placeholder="THIS IS TO CERTIFY THAT..."></textarea></label>
<label class="full">Certification Paragraph (Local Language)
<textarea id="certifyLocal"></textarea></label>

<label>Name Label (Local)<input id="labelNameLocal"></label>
<label>Gender Label (Local)<input id="labelGenderLocal"></label>
<label>Date of Birth Label (Local)<input id="labelDobLocal"></label>
<label>Place of Birth Label (Local)<input id="labelPobLocal"></label>
<label>Mother Name Label (Local)<input id="labelMotherLocal"></label>
<label>Father Name Label (Local)<input id="labelFatherLocal"></label>
<label>Address at Birth Label (Local)<input id="labelBirthAddressLocal"></label>
<label>Permanent Address Label (Local)<input id="labelPermanentAddressLocal"></label>
<label>Registration Number Label (Local)<input id="labelRegNoLocal"></label>
<label>Registration Date Label (Local)<input id="labelRegDateLocal"></label>
<label>Remarks Label (Local)<input id="labelRemarksLocal"></label>
<label>Issue Date Label (Local)<input id="labelIssueDateLocal"></label>

<label>Authorized Person Name<input id="authorizedPerson"></label>
<label>Designation (English)<input id="designationEn" placeholder="SUB-REGISTRAR (BIRTH & DEATH)"></label>
<label>Designation (Local)<input id="designationLocal"></label>
<label>Issuing Authority Text (English)<input id="issuingAuthorityEn" placeholder="SIGNATURE OF ISSUING AUTHORITY"></label>
<label>Issuing Authority Text (Local)<input id="issuingAuthorityLocal"></label>
<label>Bottom Slogan (English)<input id="sloganEn" placeholder="ENSURE REGISTRATION OF EVERY BIRTH AND DEATH"></label>
<label>Bottom Slogan (Local)<input id="sloganLocal"></label>
<label class="full">Authority Address<textarea id="address"></textarea></label>

<div class="full asset-grid">
<label>State / Authority Logo<input id="stateLogo" type="file" accept="image/*"></label>
<label>Top Center Emblem / Logo<input id="centerLogo" type="file" accept="image/*"></label>
<label>Form / Right Logo<input id="formLogo" type="file" accept="image/*"></label>
<label>Authorized Signature<input id="signature" type="file" accept="image/*"></label>
<label>Seal / Stamp<input id="seal" type="file" accept="image/*"></label>
</div>

<label><input id="isActive" type="checkbox" checked> Active</label>
<div class="full">
<button class="primary" id="saveBtn" type="submit">Save Master</button>
<button type="button" id="cancelEdit" hidden>Cancel Edit</button>
<span id="message"></span>
</div>
</form>
</section>

<section class="panel"><h2>Saved Hospital / Local Body Masters</h2><div id="masterList">Loading...</div></section>
</main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script><script src="js/auth.js"></script>
<script src="js/all-india-districts.js"></script><script src="js/hospital-master.js"></script>
</body></html>
